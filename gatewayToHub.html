  <body class="site-body orbit-body">
    <a class="skip-link" href="#main-content" data-no-transition="true">Skip to content</a>
    <div class="page-transition" data-page-transition aria-hidden="true"></div>
    <canvas class="cosmic-canvas" data-cosmic-canvas aria-hidden="true"></canvas>

    <div class="site-shell orbit-shell-page">
      <header class="site-header orbit-header">
        <a class="brand" href="index.html" aria-label="MH Horizon home">
          <span class="brand-mark">MH</span>
          <span class="brand-copy">
            <strong>MH Horizon</strong>
            <small>Gateway</small>
          </span>
        </a>

        <nav class="site-nav" id="site-nav" data-site-nav aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="index.html#hubs">Hubs</a>
          <a href="connect.html">Connect</a>
          <a href="privacy.html">Privacy</a>
        </nav>

        <div class="header-utilities">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Switch color theme"
          >
            <span class="theme-toggle-track">
              <span class="theme-toggle-thumb"></span>
            </span>
            <span class="theme-toggle-copy" data-theme-label>Dark mode</span>
          </button>

          <button
            class="nav-toggle"
            type="button"
            data-nav-toggle
            aria-expanded="false"
            aria-controls="site-nav"
          >
            Menu
          </button>
        </div>
      </header>

      <main class="orbit-main orbit-main-immersive" id="main-content" tabindex="-1">
        <section class="orbit-hero orbit-hero-immersive">
          <div class="orbit-layout orbit-layout-immersive">
            <div class="orbit-stage-wrap orbit-stage-wrap-immersive reveal">
              <div class="orbit-stage orbit-stage-immersive" id="orbit-stage">
                <div class="orbit-scene" id="orbit-scene">
                  <div class="orbit-floor" aria-hidden="true"></div>
                  <div class="orbit-grid-glow" aria-hidden="true"></div>
                  <canvas
                    class="orbit-3d-canvas"
                    data-orbit-3d-canvas
                    data-orbit-3d-mode="gateway"
                    tabindex="0"
                    role="application"
                    aria-label="Interactive 3D MH Horizon gateway. Drag to rotate the gateway, use arrow keys to choose a hub, and press Enter to open it."
                  ></canvas>
                  <div class="orbit-core" aria-hidden="true">
                    <span class="orbit-core-ring orbit-core-ring-one"></span>
                    <span class="orbit-core-ring orbit-core-ring-two"></span>
                  </div>
                  <div class="orbit-system" id="orbit-system"></div>
                </div>
                <div
                  class="orbit-focus"
                  id="orbit-focus"
                  aria-hidden="true"
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="orbit-name"
                >
                  <button
                    class="orbit-focus-close"
                    id="orbit-focus-close"
                    type="button"
                    aria-label="Close node details"
                  >
                    X
                  </button>

                  <div class="orbit-focus-copy">
                    <p class="orbit-focus-status" id="orbit-status">Live</p>
                    <p class="orbit-focus-intro">Trajectory locked</p>
                    <h2 class="orbit-focus-name" id="orbit-name">Informative Hub</h2>
                    <p class="orbit-focus-description" id="orbit-description"></p>
                    <p class="orbit-focus-tagline" id="orbit-tagline"></p>
                    <div class="orbit-focus-features overlay-features" id="orbit-features"></div>
                    <div class="orbit-focus-actions">
                      <a class="btn btn-primary magnetic" id="orbit-link" href="#">
                        <span id="orbit-link-label">Launch Pending</span>
                      </a>
                      <a class="btn btn-secondary" href="index.html#hubs">
                        Back Home
                      </a>
                    </div>
                    <p class="orbit-focus-note" id="orbit-note"></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div class="orbit-legal-links" aria-label="Gateway legal links">

        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
